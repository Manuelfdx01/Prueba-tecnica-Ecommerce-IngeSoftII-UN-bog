services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexoshop
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo_dev_password
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U nexo -d nexoshop']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nexo:nexo_dev_password@db:5432/nexoshop
      SECRET_KEY: change-this-docker-secret-before-deploy
      CORS_ORIGINS: http://localhost:5173
    ports: ['8000:8000']
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ['5173:5173']
    depends_on: [backend]
volumes:
  postgres_data:
